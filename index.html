<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad 拍照表情辨識</title>
  <!-- 載入 face-api.js 套件 (編譯後版本) -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.1); }
    h1 { color: #4f46e5; margin-bottom: 20px; }
    
    /* 圖片顯示區域 */
    #image-preview-container {
      width: 100%;
      height: 350px;
      background-color: #f3f4f6;
      border: 2px dashed #e2e8f0;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 25px;
      position: relative;
    }
    #preview {
      max-width: 100%;
      max-height: 100%;
      display: none;
    }
    #upload-placeholder { color: #94a3b8; font-size: 16px; text-align: center; }

    /* 按鈕樣式 */
    .btn {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-bottom: 10px;
      width: 100%;
      box-sizing: border-box;
    }
    .btn:active { transform: scale(0.98); background-color: #4338ca; }
    #loader { display: none; margin-top: 15px; color: #6366f1; font-weight: bold; }

    /* 辨識結果區域 */
    #result-area { display: none; margin-top: 25px; padding: 20px; background-color: #eef2ff; border-radius: 12px; border: 1px solid #c7d2fe; }
    .result-text-label { font-size: 18px; color: #4b5563; margin-bottom: 10px; }
    .result-emoji {
      font-size: 120px; /* 將 Emoji 符號超級放大 */
      margin: 15px 0;
      display: block;
      line-height: 1;
    }
    .result-text-value { font-size: 24px; font-weight: bold; color: #4f46e5; }
    #no-face-detected { display: none; margin-top: 20px; color: #ef4444; font-size: 18px; font-weight: bold; }
    #model-loading-mask {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.9);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100;
    }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- 模型載入遮罩 -->
  <div id="model-loading-mask">
    <div class="spinner"></div>
    <h3>AI 模型載入中，請稍候...</h3>
    <p style="font-size: 14px; color: #666;">首次載入需時間較長，約 10-20 秒</p>
  </div>

  <div class="container">
    <h1>🎭 拍照辨識表情</h1>
    
    <!-- 預覽區域 -->
    <div id="image-preview-container">
      <img id="preview" src="#" alt="相片預覽">
      <div id="upload-placeholder">
        <p style="font-size: 40px; margin: 0 0 10px 0;">📸</p>
        <div>點選下方按鈕拍照或上傳</div>
      </div>
    </div>

    <!-- 檔案上傳控制項 (隱藏) -->
    <input type="file" id="image-upload" accept="image/*" capture="camera" style="display: none;">
    <!-- 觸發按鈕 -->
    <button class="btn" id="upload-btn">開啟相機 / 選擇照片</button>
    <div id="loader">辨識中，請稍候...</div>

    <!-- 辨識結果 -->
    <div id="result-area">
      <div class="result-text-label">偵測到最接近的表情：</div>
      <span class="result-emoji" id="result-emoji">😐</span>
      <div class="result-text-value" id="result-text-value">自然</div>
    </div>
    <div id="no-face-detected">❌ 未偵測到人臉，請重新嘗試</div>

  </div>

  <script type="module">
    // 1. 定義表情與 Emoji 的映射表 (修正語法錯誤)
    const EMOJI_MAP = {
      happy: { emoji: '😀', text: '開心/微笑' },
      sad: { emoji: '😢', text: '難過/悲傷' },
      angry: { emoji: '😡', text: '生氣/憤怒' },
      fearful: { emoji: '😱', text: '害怕/恐懼' },
      surprised: { emoji: '😮', text: '驚訝/吃驚' },
      disgusted: { emoji: '🤢', text: '厭惡/反感' },
      neutral: { emoji: '😐', text: '自然/平靜' }
    };

    // 取得 HTML 元素
    const modelLoadingMask = document.getElementById("model-loading-mask");
    const uploadInput = document.getElementById("image-upload");
    const uploadBtn = document.getElementById("upload-btn");
    const previewImg = document.getElementById("preview");
    const placeholder = document.getElementById("upload-placeholder");
    const loaderText = document.getElementById("loader");
    const resultArea = document.getElementById("result-area");
    const resultEmoji = document.getElementById("result-emoji");
    const resultTextValue = document.getElementById("result-text-value");
    const noFaceText = document.getElementById("no-face-detected");

    // 2. 載入必要的 AI 模型 (改用穩定 CDN)
    async function loadModels() {
      const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights'; 
      try {
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);
        console.log("Model Loaded");
        modelLoadingMask.style.display = 'none'; // 隱藏載入遮罩
      } catch (e) {
        console.error("Model Error:", e);
        alert("模型載入失敗，請確認網路連線是否正常。");
        modelLoadingMask.querySelector('h3').innerText = "模型載入失敗";
        modelLoadingMask.querySelector('p').innerText = e;
      }
    }

    // 3. 處理圖片上傳與辨識
    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      // 隱藏結果，顯示圖片預覽與載入中
      hideResults();
      loaderText.style.display = 'block';

      // 讀取檔案並顯示
      const reader = new FileReader();
      reader.onload = async (e) => {
        previewImg.src = e.target.result;
        previewImg.style.display = 'block';
        placeholder.style.display = 'none';

        // 等待圖片完全載入
        previewImg.onload = async () => {
          try {
            // 4. 開始表情辨識
            const detection = await faceapi.detectSingleFace(previewImg, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();

            loaderText.style.display = 'none';

            if (detection) {
              // 5. 處理辨識結果
              const expressions = detection.expressions;
              // 找出機率最高的表情名稱
              const dominantEmotion = Object.keys(expressions).reduce((a, b) => expressions[a] > expressions[b] ? a : b);
              
              // 將結果顯示出來
              const emojiData = EMOJI_MAP[dominantEmotion] || EMOJI_MAP.neutral;
              resultEmoji.innerText = emojiData.emoji;
              resultTextValue.innerText = emojiData.text;
              resultArea.style.display = 'block';
            } else {
              noFaceText.style.display = 'block'; // 未偵測到人臉
            }
          } catch (err) {
            console.error("Detection Error:", err);
            loaderText.style.display = 'none';
            alert("辨識過程發生錯誤，請重新試一次。");
          }
        }
      };
      reader.readAsDataURL(file);
    }

    // 輔助函式：隱藏所有結果區域
    function hideResults() {
      resultArea.style.display = 'none';
      noFaceText.style.display = 'none';
    }

    // 綁定事件
    uploadBtn.addEventListener("click", () => {
        hideResults();
        uploadInput.click();
    });
    uploadInput.addEventListener("change", handleImageUpload);

    // 初始化載入模型
    loadModels();
  </script>
</body>
</html>
